[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "juwei-controller"
version = "0.1.0"
description = "Check and change settings of a Juwei-17 (OnStep) telescope mount over USB"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.scripts]
juwei = "juwei_controller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
juwei_controller = ["gui.html"]
